<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>GlamUP</title>
  <script>
    const android = "https://play.google.com/store/apps/details?id=com.glamup.client";
    const ios = "https://apps.apple.com/al/app/glamup/id6759454308";

    const ua = navigator.userAgent.toLowerCase();

    if (ua.includes("android")) {
      window.location.replace(android);
    } else if (ua.includes("iphone") || ua.includes("ipad") || ua.includes("ipod")) {
      window.location.replace(ios);
    } else {
      window.location.replace(android);
    }
  </script>
</head>
<body>
  <p>Po hapet GlamUP...</p>
  <p><a href="https://play.google.com/store/apps/details?id=com.glamup.client">Google Play</a></p>
  <p><a href="https://apps.apple.com/al/app/glamup/id6759454308">App Store</a></p>
</body>
</html>
